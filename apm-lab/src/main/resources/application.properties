server.servlet.context-path=/api
spring.application.name=doktori-api-pilot
spring.datasource.url=jdbc:mysql://mysql:3306/apmpilot
spring.datasource.username=pilot
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
logging.pattern.console=%d{ISO8601} %-5level trace_id=%X{trace_id} span_id=%X{span_id} request_id=%X{traceId} %logger{36} - %msg%n
logging.file.name=/logs/api.log
logging.pattern.file=%d{ISO8601} %-5level trace_id=%X{trace_id} span_id=%X{span_id} request_id=%X{traceId} %logger{36} - %msg%n
